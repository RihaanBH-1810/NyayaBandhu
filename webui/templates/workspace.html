<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' x='7' font-size='25'>§</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=3">

<body class="workspace">
  <a class="skip" href="#content">Skip to content</a>
  <div id="app"></div>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><div class="actions"><button type="button" data-action="expand-modal" aria-label="Expand panel">⛶</button><button type="button" data-action="close-modal" aria-label="Close panel">×</button></div></div><div id="modal-body"></div></dialog>
  <dialog id="reason-dialog" aria-labelledby="reason-title"><form id="reason-form"><div class="modal-header"><h2 id="reason-title">Reason for this action</h2><button id="reason-cancel" type="button" aria-label="Close reason dialog">×</button></div><div class="reason-content"><label for="reason-input">Reason<textarea id="reason-input" required rows="3" placeholder="Describe why you are making this change"></textarea></label><div class="actions"><button class="primary" type="submit">Continue</button></div></div></form></dialog>
  <dialog id="gazette" class="gazette-drawer" aria-labelledby="gazette-title"><div class="modal-header"><div><h2 id="gazette-title">Source gazette</h2><p>Compare the official source with the proposed wording.</p></div><button type="button" data-action="close-gazette" aria-label="Close gazette">×</button></div><iframe id="gazette-frame" title="Source gazette PDF"></iframe><a id="gazette-link" target="_blank" rel="noopener">Open PDF in a new tab</a></dialog>
  <noscript>This workspace requires JavaScript. The original document viewer is available at <a href="/viewer">/viewer</a>.</noscript>
</body>
</html>
