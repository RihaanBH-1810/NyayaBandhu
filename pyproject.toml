[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayabandhu"
version = "0.1.0"
description = "Convert legislative PDFs to Akoma Ntoso 3.0 XML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24",
    "lxml>=5.0",
]

[project.scripts]
akn-parser = "akn_parser.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["akn_parser*"]
